name: brokers.json

on:
  push:
    paths: [README.md, data/**, scripts/**, package.json, package-lock.json, .github/workflows/brokers.yml]
  pull_request:
    paths: [README.md, data/**, scripts/**, package.json, package-lock.json, .github/workflows/brokers.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:data
